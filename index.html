<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Precifica — Calculadora de Precificação</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <button class="logo" id="logo-btn" data-page="home">
      <span class="logo-mark">◧</span>
      <span class="logo-text">Precifica</span>
    </button>

    <nav class="nav-desktop" id="nav-desktop">
      <button class="nav-btn" data-page="home">Início</button>
      <button class="nav-btn" data-page="calc">Calculadora</button>
      <button class="nav-btn" data-page="report">Relatório</button>
      <button class="nav-btn" data-page="how">Como funciona</button>
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu">☰</button>
  </div>

  <nav class="nav-mobile" id="nav-mobile" hidden>
    <button class="nav-btn-mobile" data-page="home">Início</button>
    <button class="nav-btn-mobile" data-page="calc">Calculadora</button>
    <button class="nav-btn-mobile" data-page="report">Relatório</button>
    <button class="nav-btn-mobile" data-page="how">Como funciona</button>
  </nav>
</header>

<main class="container">
  <section id="page-home" class="page"></section>
  <section id="page-calc" class="page" hidden></section>
  <section id="page-report" class="page" hidden></section>
  <section id="page-how" class="page" hidden></section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>Precifica — calculadora de custo e preço sugerido</span>
    <span>Identidade visual inspirada no universo dos cubos mágicos</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
